<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RextFlex AI - Flex Text Chat</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase v9 compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        #app {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: white;
            scroll-behavior: smooth;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            z-index: 10;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header .menu-btn {
            background: none;
            border: none;
            color: #333;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .header .menu-btn:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin-right: auto;
        }

        .model-badge {
            background: #e6f2ff;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #007aff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .model-badge i {
            font-size: 14px;
        }

        .profile-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            background: #e6f2ff;
            transform: scale(1.05);
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeInUp 0.4s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            color: #000;
        }

        .user-message {
            align-self: flex-end;
            background: #dcf8c6;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: #f1f0f0;
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }

        .ai-message pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 8px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            margin: 8px 0;
        }

        .ai-message code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 13px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #e0e0e0;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 30px;
            padding: 12px 18px;
            color: #000;
            font-size: 15px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-area input:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.1);
        }

        .input-area button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #007aff;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background: white;
            border-right: 1px solid #ddd;
            transition: left 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            color: #000;
            font-size: 18px;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-sidebar:hover {
            transform: scale(1.1);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #eee;
            position: relative;
        }

        .chat-item:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .chat-item .chat-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 30px;
        }

        .chat-item .chat-time {
            font-size: 12px;
            color: #888;
        }

        .delete-chat {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            z-index: 5;
        }

        .delete-chat:hover {
            opacity: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .overlay.show {
            display: block;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(3px);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #000;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 30px;
            color: #000;
            font-size: 16px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #007aff;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: #005bbf;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,122,255,0.3);
        }

        .btn-google {
            background: #db4437;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background: #c23321;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #007aff;
            color: #007aff;
        }

        .btn-secondary:hover {
            background: #e6f2ff;
            color: #005bbf;
        }

        .toggle-text {
            text-align: center;
            color: #666;
            margin-top: 15px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .toggle-text span {
            color: #007aff;
            font-weight: 600;
        }

        .toggle-text:hover {
            color: #333;
        }

        .error-msg {
            color: #ff3b30;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }

        .profile-detail {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007aff;
        }

        .profile-avatar-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #007aff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            border: 4px solid #007aff;
        }

        .profile-info {
            text-align: center;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 600;
            color: #000;
        }

        .profile-email {
            font-size: 16px;
            color: #666;
            margin-top: 4px;
        }

        .profile-verified {
            font-size: 14px;
            color: #28a745;
            margin-top: 8px;
        }

        .profile-verified i {
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
            <h2>RextFlex AI</h2>
            <div class="model-badge"><i class="fas fa-robot"></i> Flex Text</div>
            <button class="profile-btn" id="profileBtn"><i class="fas fa-user-circle"></i></button>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-area" id="inputArea">
            <input type="text" id="messageInput" placeholder="Ask anything..." autocomplete="off">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Chat History</h3>
            <button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        <div class="chats-list" id="chatsList"></div>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>RextFlex AI</h2>
            <div id="loginForm">
                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder="Email">
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password">
                </div>
                <button class="btn" id="loginBtn">Login</button>
                <button class="btn btn-google" id="googleLoginBtn"><i class="fab fa-google"></i> Continue with Google</button>
                <div class="toggle-text">Don't have an account? <span id="showSignup">Sign Up</span></div>
                <div class="error-msg" id="loginError"></div>
            </div>
            <div id="signupForm" style="display:none;">
                <div class="input-group">
                    <input type="text" id="signupName" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <input type="email" id="signupEmail" placeholder="Email">
                </div>
                <div class="input-group">
                    <input type="password" id="signupPassword" placeholder="Password">
                </div>
                <div class="input-group">
                    <input type="password" id="signupConfirm" placeholder="Confirm Password">
                </div>
                <button class="btn" id="signupBtn">Sign Up</button>
                <button class="btn btn-google" id="googleSignupBtn"><i class="fab fa-google"></i> Continue with Google</button>
                <div class="toggle-text">Already have an account? <span id="showLogin">Login</span></div>
                <div class="error-msg" id="signupError"></div>
            </div>
            <div id="verifyEmailMessage" style="display:none; text-align:center;">
                <p style="margin-bottom:15px;">✅ Verification email sent! Please check your inbox and click the link to verify your email.</p>
                <button class="btn" id="backToLoginBtn">Back to Login</button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h2>Your Profile</h2>
            <div class="profile-detail" id="profileDetail"></div>
            <button class="btn btn-secondary" id="closeProfileBtn">Close</button>
            <button class="btn" id="logoutBtn" style="margin-top:10px; background:#ff3b30;">Logout</button>
        </div>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyCejPzkVeajGbTVMDfJcfDKfT66w0IeGRE",
            authDomain: "rextflex-ai.firebaseapp.com",
            databaseURL: "https://rextflex-ai-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rextflex-ai",
            storageBucket: "rextflex-ai.firebasestorage.app",
            messagingSenderId: "423146133124",
            appId: "1:423146133124:web:70f9dbae4fa76d3b1654d1",
            measurementId: "G-JNR2RZZHTL"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==================== SAMBANOVA API (Flex Text) ====================
        const SAMBA_API_KEY = "d412a873-c41b-4d2d-8255-f8df2d17de6c";
        const SAMBA_API_URL = "https://api.sambanova.ai/v1/chat/completions";
        const MODEL_NAME = "gpt-oss-120b";

        // ==================== GLOBAL VARIABLES ====================
        let currentUser = null;
        let currentChatId = null;
        let messagesListener = null;
        let chatsListener = null;

        // DOM elements
        const loginModal = document.getElementById('loginModal');
        const profileModal = document.getElementById('profileModal');
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const closeSidebar = document.getElementById('closeSidebar');
        const overlay = document.getElementById('overlay');
        const chatsList = document.getElementById('chatsList');
        const profileBtn = document.getElementById('profileBtn');
        const closeProfileBtn = document.getElementById('closeProfileBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        // Login/Signup elements
        const loginFormDiv = document.getElementById('loginForm');
        const signupFormDiv = document.getElementById('signupForm');
        const verifyMessageDiv = document.getElementById('verifyEmailMessage');
        const showSignup = document.getElementById('showSignup');
        const showLogin = document.getElementById('showLogin');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const googleSignupBtn = document.getElementById('googleSignupBtn');
        const backToLoginBtn = document.getElementById('backToLoginBtn');
        const loginError = document.getElementById('loginError');
        const signupError = document.getElementById('signupError');

        // ==================== AUTH STATE WITH EMAIL VERIFICATION ====================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                if (user.emailVerified || user.providerData[0]?.providerId === 'google.com') {
                    currentUser = user;
                    loginModal.classList.remove('show');
                    await loadUserChats();
                    if (!currentChatId) {
                        await createNewChat();
                    } else {
                        loadMessages(currentChatId);
                    }
                    updateProfileModal();
                } else {
                    await auth.signOut();
                    loginModal.classList.add('show');
                    loginError.textContent = "❌ Please verify your email before logging in. Check your inbox.";
                }
            } else {
                currentUser = null;
                currentChatId = null;
                loginModal.classList.add('show');
                chatContainer.innerHTML = '';
                if (messagesListener) messagesListener();
                if (chatsListener) chatsListener();
            }
        });

        // ==================== PROFILE MODAL ====================
        function updateProfileModal() {
            if (!currentUser) return;
            const profileDetail = document.getElementById('profileDetail');
            const user = currentUser;
            const name = user.displayName || 'User';
            const email = user.email || '';
            const photoURL = user.photoURL;
            const verified = user.emailVerified ? '<i class="fas fa-check-circle"></i> Verified' : '<i class="fas fa-times-circle"></i> Not Verified';
            profileDetail.innerHTML = `
                ${photoURL ? `<img src="${photoURL}" class="profile-avatar">` : `<div class="profile-avatar-placeholder">${name.charAt(0).toUpperCase()}</div>`}
                <div class="profile-info">
                    <div class="profile-name">${escapeHtml(name)}</div>
                    <div class="profile-email">${escapeHtml(email)}</div>
                    <div class="profile-verified">${verified}</div>
                </div>
            `;
        }

        profileBtn.addEventListener('click', () => {
            if (currentUser) {
                updateProfileModal();
                profileModal.classList.add('show');
            } else {
                loginModal.classList.add('show');
            }
        });

        closeProfileBtn.addEventListener('click', () => {
            profileModal.classList.remove('show');
        });

        logoutBtn.addEventListener('click', () => {
            auth.signOut();
            profileModal.classList.remove('show');
        });

        // ==================== LOGIN / SIGNUP TOGGLE ====================
        showSignup.addEventListener('click', () => {
            loginFormDiv.style.display = 'none';
            signupFormDiv.style.display = 'block';
            verifyMessageDiv.style.display = 'none';
            loginError.textContent = '';
            signupError.textContent = '';
        });

        showLogin.addEventListener('click', () => {
            signupFormDiv.style.display = 'none';
            loginFormDiv.style.display = 'block';
            verifyMessageDiv.style.display = 'none';
            loginError.textContent = '';
            signupError.textContent = '';
        });

        backToLoginBtn.addEventListener('click', () => {
            loginFormDiv.style.display = 'block';
            signupFormDiv.style.display = 'none';
            verifyMessageDiv.style.display = 'none';
            loginError.textContent = '';
        });

        // ==================== LOGIN ====================
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            loginError.textContent = '';
            
            if (!email || !password) {
                loginError.textContent = "❌ Please fill all fields";
                return;
            }

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                if (!user.emailVerified) {
                    await auth.signOut();
                    loginError.textContent = "❌ Please verify your email first. Check your inbox.";
                }
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    loginError.textContent = "❌ Email Wrong ❌";
                } else if (error.code === 'auth/wrong-password') {
                    loginError.textContent = "❌ Password Wrong ❌";
                } else if (error.code === 'auth/invalid-email') {
                    loginError.textContent = "❌ Invalid email format";
                } else {
                    loginError.textContent = "❌ " + error.message;
                }
            }
        });

        // ==================== SIGNUP ====================
        signupBtn.addEventListener('click', async () => {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            signupError.textContent = '';

            if (!name || !email || !password || !confirm) {
                signupError.textContent = "❌ Please fill all fields";
                return;
            }
            if (password !== confirm) {
                signupError.textContent = "❌ Passwords don't match";
                return;
            }
            if (password.length < 6) {
                signupError.textContent = "❌ Password should be at least 6 characters";
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                await user.updateProfile({ displayName: name });
                await user.sendEmailVerification();
                loginFormDiv.style.display = 'none';
                signupFormDiv.style.display = 'none';
                verifyMessageDiv.style.display = 'block';
                await auth.signOut();
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    signupError.textContent = "❌ Email Already Exists ❌";
                } else if (error.code === 'auth/invalid-email') {
                    signupError.textContent = "❌ Invalid email format";
                } else {
                    signupError.textContent = "❌ " + error.message;
                }
            }
        });

        // ==================== GOOGLE SIGN-IN ====================
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        async function googleSignIn() {
            loginError.textContent = '';
            signupError.textContent = '';
            try {
                await auth.signInWithPopup(googleProvider);
            } catch (error) {
                const errMsg = error.message;
                if (loginFormDiv.style.display !== 'none') {
                    loginError.textContent = "❌ Google sign-in failed: " + errMsg;
                } else {
                    signupError.textContent = "❌ Google sign-in failed: " + errMsg;
                }
            }
        }
        googleLoginBtn.addEventListener('click', googleSignIn);
        googleSignupBtn.addEventListener('click', googleSignIn);

        // ==================== SIDEBAR ====================
        menuBtn.addEventListener('click', () => {
            if (currentUser) {
                sidebar.classList.add('open');
                overlay.classList.add('show');
            }
        });
        closeSidebar.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });

        // ==================== CHATS & MESSAGES ====================
        async function loadUserChats() {
            if (!currentUser) return;
            if (chatsListener) chatsListener();

            chatsListener = db.collection('chats')
                .where('userId', '==', currentUser.uid)
                .orderBy('updatedAt', 'desc')
                .onSnapshot((snapshot) => {
                    const chats = [];
                    snapshot.forEach(doc => chats.push({ id: doc.id, ...doc.data() }));
                    renderChatsList(chats);
                }, (error) => {
                    console.error("Chats listener error:", error);
                    if (error.code === 'failed-precondition') {
                        alert('Firestore index missing. Please create the index as per instructions.');
                    }
                });
        }

        function renderChatsList(chats) {
            chatsList.innerHTML = '';
            if (chats.length === 0) {
                chatsList.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">No chats yet</div>';
                return;
            }
            chats.forEach(chat => {
                const chatDiv = document.createElement('div');
                chatDiv.className = 'chat-item';
                chatDiv.dataset.id = chat.id;
                const title = chat.title || 'New conversation';
                const time = chat.updatedAt ? new Date(chat.updatedAt.toDate()).toLocaleString() : 'Just now';
                chatDiv.innerHTML = `
                    <div class="chat-title">${escapeHtml(title)}</div>
                    <div class="chat-time">${time}</div>
                    <button class="delete-chat" data-id="${chat.id}"><i class="fas fa-trash"></i></button>
                `;
                chatDiv.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-chat')) return;
                    switchChat(chat.id);
                });
                chatsList.appendChild(chatDiv);
            });

            document.querySelectorAll('.delete-chat').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const chatId = btn.dataset.id;
                    if (confirm('Delete this chat?')) {
                        try {
                            const messagesSnapshot = await db.collection('chats').doc(chatId).collection('messages').get();
                            const batch = db.batch();
                            messagesSnapshot.forEach(doc => batch.delete(doc.ref));
                            await batch.commit();
                            await db.collection('chats').doc(chatId).delete();
                            if (currentChatId === chatId) {
                                currentChatId = null;
                                chatContainer.innerHTML = '';
                                await createNewChat();
                            }
                        } catch (error) {
                            console.error("Delete error:", error);
                            alert("Error deleting chat: " + error.message);
                        }
                    }
                });
            });
        }

        async function createNewChat() {
            if (!currentUser) return;
            const chatRef = await db.collection('chats').add({
                userId: currentUser.uid,
                title: 'New conversation',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            currentChatId = chatRef.id;
            loadMessages(currentChatId);
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        function switchChat(chatId) {
            currentChatId = chatId;
            loadMessages(chatId);
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        function loadMessages(chatId) {
            if (messagesListener) messagesListener();
            messagesListener = db.collection('chats').doc(chatId)
                .collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    chatContainer.innerHTML = '';
                    snapshot.forEach(doc => displayMessage(doc.data()));
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                });
        }

        function displayMessage(msg) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.role === 'user' ? 'user-message' : 'ai-message'}`;
            if (msg.role === 'user') {
                messageDiv.textContent = msg.content;
            } else {
                if (msg.content && msg.content.includes('```')) {
                    messageDiv.innerHTML = formatCodeBlocks(msg.content);
                } else {
                    messageDiv.textContent = msg.content || '...';
                }
            }
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatCodeBlocks(text) {
            let formatted = '';
            const parts = text.split('```');
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    formatted += parts[i].replace(/\n/g, '<br>');
                } else {
                    const lines = parts[i].split('\n');
                    const lang = lines[0].trim();
                    const code = lines.slice(1).join('\n');
                    formatted += `<pre><code class="language-${lang}">${escapeHtml(code)}</code></pre>`;
                }
            }
            return formatted;
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const prompt = messageInput.value.trim();
            if (!prompt || !currentUser || !currentChatId) return;

            messageInput.value = '';
            sendBtn.disabled = true;

            await db.collection('chats').doc(currentChatId).collection('messages').add({
                role: 'user',
                content: prompt,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            const chatDoc = await db.collection('chats').doc(currentChatId).get();
            if (chatDoc.exists && chatDoc.data().title === 'New conversation') {
                await db.collection('chats').doc(currentChatId).update({
                    title: prompt.substring(0, 30) + (prompt.length > 30 ? '...' : ''),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } else {
                await db.collection('chats').doc(currentChatId).update({
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            const loadingMsgRef = await db.collection('chats').doc(currentChatId).collection('messages').add({
                role: 'ai',
                content: '⏳ Thinking...',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            try {
                const aiResponse = await generateChatResponse(prompt);
                await loadingMsgRef.update({
                    content: aiResponse,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error('Generation error:', error);
                await loadingMsgRef.update({
                    content: '❌ Error: ' + error.message,
                });
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ==================== SAMBANOVA API CALL WITH FIXED IDENTITY ====================
        async function generateChatResponse(prompt) {
            const requestBody = {
                model: MODEL_NAME,
                messages: [
                    {
                        role: "system",
                        content: "You are RextFlex AI, a helpful AI assistant created by RextFlex. Always identify yourself as RextFlex AI. Never claim to be ChatGPT, OpenAI, Google, Gemini, Claude, or any other AI model. When asked 'Who are you?' or 'What AI are you?', respond with 'I am RextFlex AI, your intelligent assistant.' Respond in the same language as the user."
                    },
                    {
                        role: "user",
                        content: prompt
                    }
                ],
                temperature: 0.7,
                top_p: 0.9,
                max_tokens: 2048
            };

            const response = await fetch(SAMBA_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SAMBA_API_KEY}`
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API error (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            const assistantMessage = data.choices?.[0]?.message?.content;
            if (!assistantMessage) {
                throw new Error("Invalid response structure from API");
            }
            return assistantMessage;
        }

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('show');
            }
        });
    </script>
</body>
