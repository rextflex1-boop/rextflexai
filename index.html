<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RextFlex AI — Gemini Free • File Share</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        /* Same premium styles as before (keeping it compact) */
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui}
        body{background:radial-gradient(circle at 10% 30%,#0b1120,#0a0f1c);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
        #app{width:100%;max-width:500px;height:95vh;background:rgba(18,25,45,0.85);backdrop-filter:blur(12px);border-radius:2rem;display:flex;flex-direction:column;box-shadow:0 25px 45px rgba(0,0,0,0.5);border:1px solid rgba(255,215,0,0.2);overflow:hidden}
        .header{display:flex;align-items:center;padding:12px 20px;background:rgba(10,20,35,0.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,215,0,0.3);gap:12px}
        .menu-btn,.profile-btn{background:rgba(255,215,0,0.12);border:none;color:#FFD966;font-size:1.4rem;width:42px;height:42px;border-radius:18px;cursor:pointer;transition:0.25s}
        .menu-btn:hover,.profile-btn:hover{background:#FFD966;color:#0a0f1c;transform:scale(1.05)}
        .header h2{font-size:1.45rem;font-weight:700;background:linear-gradient(135deg,#FFE6B0,#FFB347);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto}
        .model-badge{background:rgba(0,0,0,0.55);padding:6px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#FFD966;border:1px solid #FFD966}
        .chat-container{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;background:rgba(8,14,26,0.4)}
        .message{max-width:85%;padding:12px 18px;border-radius:26px;line-height:1.45;animation:floatIn 0.35s ease}
        .user-message{align-self:flex-end;background:linear-gradient(135deg,#FFD966,#FFB347);color:#0b1120}
        .ai-message{align-self:flex-start;background:rgba(30,40,60,0.9);color:#f0f3fa;border:1px solid rgba(255,217,0,0.3)}
        .file-attach-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,0.2);border-radius:30px;padding:4px 10px;font-size:11px;margin-top:6px}
        .ai-message pre{background:#0a0f1c;padding:12px;border-radius:16px;overflow-x:auto}
        .input-area{display:flex;align-items:center;padding:12px 16px;background:rgba(10,20,35,0.85);border-top:1px solid rgba(255,215,0,0.3);gap:10px}
        .file-label{width:48px;height:48px;border-radius:30px;background:rgba(255,217,0,0.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;color:#FFD966}
        .input-area input{flex:1;background:rgba(0,0,0,0.5);border:1px solid rgba(255,217,0,0.5);border-radius:60px;padding:14px 20px;color:white}
        .input-area button{width:52px;height:52px;border-radius:30px;background:linear-gradient(145deg,#FFD966,#FFB347);border:none;color:#0b1120;font-size:1.4rem;cursor:pointer}
        .file-preview-area{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px;background:rgba(0,0,0,0.4)}
        .file-chip{background:rgba(255,217,0,0.2);border-radius:30px;padding:5px 12px;font-size:11px;color:#FFD966}
        .sidebar{position:fixed;top:0;left:-320px;width:300px;height:100vh;background:rgba(12,20,32,0.98);backdrop-filter:blur(20px);border-right:1px solid #FFD966;transition:left 0.3s;z-index:1000}
        .sidebar.open{left:0}
        .chat-item{background:rgba(255,217,0,0.08);margin-bottom:12px;border-radius:20px;padding:14px;cursor:pointer;position:relative}
        .delete-chat{position:absolute;top:10px;right:10px;background:none;border:none;color:#ff8888;cursor:pointer}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:2000}
        .modal.show{display:flex}
        .modal-content{background:#111827;border-radius:2rem;padding:32px;width:90%;max-width:400px;border:1px solid #FFD966;color:white}
        .btn{background:linear-gradient(95deg,#FFD966,#FFB347);border:none;border-radius:50px;padding:12px;font-weight:bold;width:100%;margin-top:10px;cursor:pointer}
        @keyframes floatIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .overlay{background:rgba(0,0,0,0.5);position:fixed;z-index:999;display:none;top:0;left:0;width:100%;height:100%}
        .overlay.show{display:block}
        .profile-avatar-placeholder{width:80px;height:80px;background:#FFD966;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px}
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <button class="menu-btn" id="menuBtn"><i class="fas fa-gem"></i></button>
        <h2>RextFlex AI <span style="font-size:12px;">✨Gemini Free</span></h2>
        <div class="model-badge"><i class="fab fa-google"></i> Gemini 1.5 Flash</div>
        <button class="profile-btn" id="profileBtn"><i class="fas fa-crown"></i></button>
    </div>
    <div class="chat-container" id="chatContainer"></div>
    <div id="filePreviewContainer" class="file-preview-area" style="display: none;"></div>
    <div class="input-area">
        <label class="file-label" id="attachFileBtn"><i class="fas fa-paperclip"></i><input type="file" id="fileInput" multiple style="display: none;"></label>
        <input type="text" id="messageInput" placeholder="Ask anything (Free Gemini)..." autocomplete="off">
        <button id="sendBtn"><i class="fas fa-bolt"></i></button>
    </div>
</div>

<div class="sidebar" id="sidebar"><div class="sidebar-header" style="padding:20px; border-bottom:1px solid #FFD966;"><h3>📜 Chats</h3><button class="close-sidebar" id="closeSidebar" style="background:none; border:none; color:#FFD966; font-size:24px;">✖</button></div><div class="chats-list" id="chatsList"></div></div>
<div class="overlay" id="overlay"></div>

<!-- Login Modal (same as before) -->
<div class="modal" id="loginModal"><div class="modal-content"><h2>✨ RextFlex AI</h2><div id="loginForm"><div class="input-group"><input type="email" id="loginEmail" placeholder="Email"></div><div class="input-group"><input type="password" id="loginPassword" placeholder="Password"></div><button class="btn" id="loginBtn">Login</button><button class="btn btn-google" id="googleLoginBtn" style="background:#db4437;">Google</button><div class="toggle-text">New? <span id="showSignup">Sign Up</span></div><div class="error-msg" id="loginError"></div></div><div id="signupForm" style="display:none;"><input type="text" id="signupName" placeholder="Full Name"><input type="email" id="signupEmail" placeholder="Email"><input type="password" id="signupPassword" placeholder="Password"><input type="password" id="signupConfirm" placeholder="Confirm"><button class="btn" id="signupBtn">Sign Up</button><button class="btn btn-google" id="googleSignupBtn" style="background:#db4437;">Google</button><div class="toggle-text">Back to <span id="showLogin">Login</span></div><div class="error-msg" id="signupError"></div></div><div id="verifyEmailMessage" style="display:none;"><p>✅ Verify email & login</p><button class="btn" id="backToLoginBtn">Back</button></div></div></div>
<div class="modal" id="profileModal"><div class="modal-content"><h2>👑 Profile</h2><div id="profileDetail"></div><button class="btn" id="closeProfileBtn">Close</button><button class="btn" id="logoutBtn" style="background:#b91c1c;">Logout</button></div></div>

<script>
    // ==================== FIREBASE CONFIG (same) ====================
    const firebaseConfig = {
        apiKey: "AIzaSyCejPzkVeajGbTVMDfJcfDKfT66w0IeGRE",
        authDomain: "rextflex-ai.firebaseapp.com",
        databaseURL: "https://rextflex-ai-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rextflex-ai",
        storageBucket: "rextflex-ai.firebasestorage.app",
        messagingSenderId: "423146133124",
        appId: "1:423146133124:web:70f9dbae4fa76d3b1654d1"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ==================== GEMINI FREE API ====================
    // 🔑 GET YOUR FREE API KEY FROM: https://aistudio.google.com/apikey
    const GEMINI_API_KEY = "AQ.Ab8RN6Lyow_L3ZnFIR5dXT9Tnw_e9j4y4t5XC62vdPY0omFdEA";  // <--- REPLACE WITH YOUR KEY
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    let currentUser = null, currentChatId = null, messagesListener = null, chatsListener = null, selectedFiles = [];
    
    // DOM elements
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const overlay = document.getElementById('overlay');
    const chatsList = document.getElementById('chatsList');
    const profileBtn = document.getElementById('profileBtn');
    const closeProfileBtn = document.getElementById('closeProfileBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const fileInput = document.getElementById('fileInput');
    const attachFileBtn = document.getElementById('attachFileBtn');
    const filePreviewContainer = document.getElementById('filePreviewContainer');
    
    // Auth modals
    const loginModal = document.getElementById('loginModal');
    const profileModal = document.getElementById('profileModal');
    const loginFormDiv = document.getElementById('loginForm');
    const signupFormDiv = document.getElementById('signupForm');
    const verifyMessageDiv = document.getElementById('verifyEmailMessage');
    const showSignup = document.getElementById('showSignup');
    const showLogin = document.getElementById('showLogin');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const googleSignupBtn = document.getElementById('googleSignupBtn');
    const backToLoginBtn = document.getElementById('backToLoginBtn');
    const loginError = document.getElementById('loginError');
    const signupError = document.getElementById('signupError');
    
    // File preview
    function updateFilePreview() {
        filePreviewContainer.innerHTML = '';
        if (selectedFiles.length === 0) { filePreviewContainer.style.display = 'none'; return; }
        filePreviewContainer.style.display = 'flex';
        selectedFiles.forEach((f, idx) => {
            const chip = document.createElement('div'); chip.className = 'file-chip';
            chip.innerHTML = `<i class="fas fa-file-alt"></i> ${f.name.substring(0, 20)} <button class="remove-file" data-idx="${idx}" style="background:none; border:none; color:#ff9966; cursor:pointer;">✖</button>`;
            chip.querySelector('.remove-file').addEventListener('click', () => { selectedFiles.splice(idx,1); updateFilePreview(); });
            filePreviewContainer.appendChild(chip);
        });
    }
    attachFileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        for (const file of files) {
            if (file.type.startsWith('text/') || file.name.endsWith('.js') || file.name.endsWith('.html') || file.name.endsWith('.txt')) {
                const text = await file.text();
                selectedFiles.push({ name: file.name, type: 'text', content: text.substring(0,3000) });
            } else {
                selectedFiles.push({ name: file.name, type: 'binary' });
            }
        }
        updateFilePreview();
        fileInput.value = '';
    });
    
    // Auth handlers (same as before - working)
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            if (user.emailVerified || user.providerData[0]?.providerId === 'google.com') {
                currentUser = user; loginModal.classList.remove('show');
                await loadUserChats();
                if (!currentChatId) await createNewChat(); else loadMessages(currentChatId);
                updateProfileModal();
            } else { await auth.signOut(); loginModal.classList.add('show'); loginError.textContent = "❌ Verify email first."; }
        } else { currentUser = null; currentChatId = null; loginModal.classList.add('show'); chatContainer.innerHTML = ''; if(messagesListener) messagesListener(); if(chatsListener) chatsListener(); }
    });
    function updateProfileModal() { if(!currentUser) return; document.getElementById('profileDetail').innerHTML = `<div class="profile-avatar-placeholder">${(currentUser.displayName||'U').charAt(0)}</div><div class="profile-info"><div class="profile-name">${escapeHtml(currentUser.displayName||'User')}</div><div class="profile-email">${escapeHtml(currentUser.email)}</div><div class="profile-verified"><i class="fas fa-crown"></i> Gemini Free</div></div>`; }
    
    // Chat functions
    async function loadUserChats() { if(!currentUser) return; if(chatsListener) chatsListener(); chatsListener = db.collection('chats').where('userId','==',currentUser.uid).orderBy('updatedAt','desc').onSnapshot(snapshot=>{ const chats=[]; snapshot.forEach(doc=>chats.push({id:doc.id,...doc.data()})); renderChatsList(chats); }); }
    function renderChatsList(chats) { chatsList.innerHTML=''; if(chats.length===0){ chatsList.innerHTML='<div style="color:#aaa;text-align:center;">✨ No chats</div>'; return; } chats.forEach(chat=>{ const div=document.createElement('div'); div.className='chat-item'; div.dataset.id=chat.id; div.innerHTML=`<div class="chat-title">${escapeHtml(chat.title||'New chat')}</div><div class="chat-time">${chat.updatedAt?.toDate?.()?.toLocaleString()||'Now'}</div><button class="delete-chat" data-id="${chat.id}"><i class="fas fa-trash-alt"></i></button>`; div.addEventListener('click',(e)=>{ if(!e.target.closest('.delete-chat')) switchChat(chat.id); }); chatsList.appendChild(div); }); document.querySelectorAll('.delete-chat').forEach(btn=>btn.addEventListener('click',async(e)=>{ e.stopPropagation(); const id=btn.dataset.id; if(confirm('Delete?')){ await db.collection('chats').doc(id).collection('messages').get().then(snap=>{ snap.forEach(d=>d.ref.delete()); }); await db.collection('chats').doc(id).delete(); if(currentChatId===id){ currentChatId=null; chatContainer.innerHTML=''; await createNewChat(); } } })); }
    async function createNewChat() { if(!currentUser) return; const ref = await db.collection('chats').add({ userId: currentUser.uid, title: 'New chat', createdAt: firebase.firestore.FieldValue.serverTimestamp(), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); currentChatId = ref.id; loadMessages(currentChatId); sidebar.classList.remove('open'); overlay.classList.remove('show'); }
    function switchChat(chatId){ currentChatId=chatId; loadMessages(chatId); sidebar.classList.remove('open'); overlay.classList.remove('show'); }
    function loadMessages(chatId){ if(messagesListener) messagesListener(); messagesListener = db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp','asc').onSnapshot(snapshot=>{ chatContainer.innerHTML=''; snapshot.forEach(doc=>displayMessage(doc.data())); chatContainer.scrollTop = chatContainer.scrollHeight; }); }
    function displayMessage(msg){ const div=document.createElement('div'); div.className=`message ${msg.role==='user'?'user-message':'ai-message'}`; if(msg.role==='user'){ let html=`<div>${escapeHtml(msg.content||'')}</div>`; if(msg.attachments) html+=`<div class="file-attach-badge"><i class="fas fa-paperclip"></i> ${msg.attachments.map(a=>a.name).join(', ')}</div>`; div.innerHTML=html; } else { if(msg.content?.includes('```')) div.innerHTML=formatCodeBlocks(msg.content); else div.textContent=msg.content||'...'; } chatContainer.appendChild(div); chatContainer.scrollTop=chatContainer.scrollHeight; }
    function formatCodeBlocks(text){ return text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>').replace(/\n/g,'<br>'); }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    // ==================== GEMINI API CALL (FREE) ====================
    async function callGemini(chatId, userPrompt, attachedFiles) {
        // Build conversation history
        const snapshot = await db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp','asc').get();
        let history = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            if (data.role === 'user') history.push({ role: 'user', parts: [{ text: data.content }] });
            else if (data.role === 'ai' && !data.content.includes('💎')) history.push({ role: 'model', parts: [{ text: data.content }] });
        });
        // Enhance last user message with file contents
        let finalUserText = userPrompt || "";
        for (const f of attachedFiles) {
            if (f.type === 'text') finalUserText += `\n\n[File: ${f.name}]\n${f.content}`;
            else finalUserText += `\n\n[Attached file: ${f.name}]`;
        }
        if (history.length > 0 && history[history.length-1].role === 'user') history[history.length-1].parts[0].text = finalUserText;
        else history.push({ role: 'user', parts: [{ text: finalUserText }] });
        
        // System instruction
        const systemInstruction = "You are RextFlex AI, powered by Google Gemini. Always identify as RextFlex AI. Never claim to be ChatGPT or other models. Answer helpfully in user's language.";
        
        const requestBody = {
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents: history,
            generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
        };
        
        try {
            const response = await fetch(GEMINI_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return data.candidates[0].content.parts[0].text;
        } catch (err) {
            console.error(err);
            return `❌ Gemini Error: ${err.message}. Make sure API key is valid and free tier active.`;
        }
    }
    
    // Send message
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
    
    async function sendMessage() {
        const prompt = messageInput.value.trim();
        if ((!prompt && selectedFiles.length===0) || !currentUser || !currentChatId) return;
        const filesToSend = [...selectedFiles];
        messageInput.value = '';
        
        await db.collection('chats').doc(currentChatId).collection('messages').add({
            role: 'user', content: prompt || "📎 Files attached", attachments: filesToSend.map(f=> ({name:f.name})), timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        const chatSnap = await db.collection('chats').doc(currentChatId).get();
        if (chatSnap.exists && chatSnap.data().title === 'New chat' && prompt) await db.collection('chats').doc(currentChatId).update({ title: prompt.substring(0,35), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        else await db.collection('chats').doc(currentChatId).update({ updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        
        const loadingRef = await db.collection('chats').doc(currentChatId).collection('messages').add({ role: 'ai', content: '💎 RextFlex thinking...', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        selectedFiles = []; updateFilePreview();
        
        try {
            const aiReply = await callGemini(currentChatId, prompt, filesToSend);
            await loadingRef.update({ content: aiReply, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        } catch(e) { await loadingRef.update({ content: `❌ Error: ${e.message}` }); }
    }
    
    // Auth UI handlers
    showSignup.onclick = () => { loginFormDiv.style.display='none'; signupFormDiv.style.display='block'; verifyMessageDiv.style.display='none'; };
    showLogin.onclick = () => { signupFormDiv.style.display='none'; loginFormDiv.style.display='block'; verifyMessageDiv.style.display='none'; };
    backToLoginBtn.onclick = () => { loginFormDiv.style.display='block'; signupFormDiv.style.display='none'; verifyMessageDiv.style.display='none'; };
    loginBtn.onclick = async () => { const email=document.getElementById('loginEmail').value.trim(), pwd=document.getElementById('loginPassword').value; try{ const cred=await auth.signInWithEmailAndPassword(email,pwd); if(!cred.user.emailVerified && cred.user.providerData[0]?.providerId !=='google.com'){ await auth.signOut(); loginError.innerText="❌ Verify email"; } } catch(e){ loginError.innerText=e.code==='auth/user-not-found'?'❌ Email Wrong':e.code==='auth/wrong-password'?'❌ Password Wrong':'❌ '+e.message; } };
    signupBtn.onclick = async () => { const name=document.getElementById('signupName').value.trim(), email=document.getElementById('signupEmail').value.trim(), pwd=document.getElementById('signupPassword').value, confirm=document.getElementById('signupConfirm').value; if(pwd!==confirm){ signupError.innerText="Passwords mismatch"; return; } try{ const cred=await auth.createUserWithEmailAndPassword(email,pwd); await cred.user.updateProfile({displayName:name}); await cred.user.sendEmailVerification(); loginFormDiv.style.display='none'; signupFormDiv.style.display='none'; verifyMessageDiv.style.display='block'; await auth.signOut(); } catch(e){ signupError.innerText=e.message; } };
    const googleSign = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    googleLoginBtn.onclick = googleSign; googleSignupBtn.onclick = googleSign;
    profileBtn.onclick = () => { if(currentUser){ updateProfileModal(); profileModal.classList.add('show'); } else loginModal.classList.add('show'); };
    closeProfileBtn.onclick = () => profileModal.classList.remove('show');
    logoutBtn.onclick = () => { auth.signOut(); profileModal.classList.remove('show'); };
    menuBtn.onclick = () => { if(currentUser){ sidebar.classList.add('open'); overlay.classList.add('show'); } };
    closeSidebar.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); };
    overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); };
    window.onclick = (e) => { if(e.target.classList.contains('modal')) e.target.classList.remove('show'); };
    
    if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY") console.warn("⚠️ Please replace YOUR_GEMINI_API_KEY with your actual Gemini API key from https://aistudio.google.com/apikey");
</script>
</body>
</html>
